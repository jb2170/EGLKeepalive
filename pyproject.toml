[project]
name = "EGLKeepalive"
dynamic = ["version"]
description = "Keep a GPU from sleeping by nudging an EGL context"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
dependencies = [
  "moderngl",
]

[project.urls]
Homepage = "https://github.com/jb2170/EGLKeepalive/"

[project.scripts]
egl-keepalive = "EGLKeepalive:main"

[tool.setuptools.dynamic]
version = {attr = "EGLKeepalive.__version__"}

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
